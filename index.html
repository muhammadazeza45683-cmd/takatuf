<meta charset="utf-8">

<style>
:root{--o:#0f4d2e;--o2:#07301c;--o3:#1c7a48;--cr:#eef3e8;--au:#c8a24a;--tc:#a4552e;--tx:#232817;--sh:0 4px 14px rgba(7,48,28,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--cr);color:var(--tx);line-height:1.6}
.hide{display:none!important}
.login{min-height:100vh;background:radial-gradient(circle at 15% 10%,#1c7a4855 0,transparent 40%),radial-gradient(circle at 90% 85%,#c8a24a33 0,transparent 35%),linear-gradient(160deg,var(--o2),var(--o));display:flex;align-items:center;justify-content:center;padding:18px}
.box{background:#fffdf6;width:100%;max-width:390px;padding:34px 24px 26px;border-radius:24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:6px solid var(--au)}
.emb{width:84px;height:84px;margin:-76px auto 10px;border-radius:50%;background:linear-gradient(145deg,var(--o3),var(--o2));display:flex;align-items:center;justify-content:center;font-size:40px;border:5px solid var(--au);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.brand{font-size:38px;font-weight:800;color:var(--o);letter-spacing:1px;line-height:1.2}
.sub{color:#7a7d62;font-size:14px;margin:2px 0 18px}
input,select,textarea{width:100%;font-size:16px;padding:12px 14px;margin:5px 0;border:1.5px solid #ddd6b8;border-radius:12px;background:#fff;font-family:inherit;color:var(--tx);outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--au);box-shadow:0 0 0 3px #c8a24a33}
.ltr{direction:ltr;text-align:left}
.btn{width:100%;background:linear-gradient(135deg,var(--o3),var(--o2));color:#fff;font-size:16px;font-weight:700;padding:13px;border:0;border-radius:12px;margin-top:10px;font-family:inherit;box-shadow:var(--sh);transition:.15s}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(135deg,#e0c070,var(--au));color:var(--o2)}
.err{color:#b03a2e;min-height:20px;font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--o2),var(--o));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--au);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.bar .lg{width:42px;height:42px;border-radius:50%;background:#ffffff1f;border:2px solid var(--au);display:flex;align-items:center;justify-content:center;font-size:22px}
.bar b{flex:1;font-size:22px;font-weight:800;line-height:1.1}
.bar small{display:block;font-weight:600;font-size:12px;color:var(--au)}
.bar button{background:#ffffff1f;color:#fff;border:1px solid #ffffff44;border-radius:10px;padding:7px 14px;font-family:inherit;font-weight:600}
.tabs{display:flex;gap:8px;padding:12px 12px 4px;overflow-x:auto}
.tabs button{flex:1;min-width:84px;padding:10px 8px;border:0;border-radius:14px;background:#fff;color:var(--o2);font-size:15px;font-weight:700;font-family:inherit;box-shadow:var(--sh);transition:.2s}
.tabs button.on{background:linear-gradient(135deg,var(--o3),var(--o2));color:#fff;transform:translateY(-1px)}
.card{background:#fff;margin:12px;padding:16px;border-radius:18px;box-shadow:var(--sh);border:1px solid #eee7cc}
.card h3{margin:0 0 10px;color:var(--o);font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:5px;height:20px;background:var(--au);border-radius:3px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f0ebd6}
.item:last-child{border:0}
.item span{flex:1;word-break:break-word}
.item.done span{text-decoration:line-through;color:#aaa}
.x{background:#a4552e14;border:0;color:var(--tc);font-size:16px;width:34px;height:34px;border-radius:10px;flex:0 0 auto}
.mu{color:#8a8d72;font-size:13px}
.tag{background:linear-gradient(135deg,var(--o3),var(--o2));color:#fff;border:0;border-radius:10px;padding:7px 14px;font-family:inherit;font-weight:600;flex:0 0 auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;text-align:center;overflow:hidden;border-radius:12px}
th{background:var(--o2);color:#fff;padding:9px 4px;font-weight:700}
td{padding:9px 4px;border-bottom:1px solid #f0ebd6}
td.nm{text-align:right;font-weight:700;padding-right:8px}
tr:nth-child(even) td{background:#faf7ea}
tr.r1 td{background:#f7e9b8!important;font-weight:800}
tr.r2 td{background:#ecebe4!important}
tr.r3 td{background:#f1dfd0!important}
td:last-child{font-weight:800;color:var(--o)}
#paperWrap{position:fixed;inset:0;background:#000b;overflow:auto;padding:14px;z-index:9}
.paper{background:#fffef9;max-width:640px;margin:0 auto;padding:34px 30px;min-height:620px;position:relative;border:2px solid var(--o);outline:6px solid #fffef9;box-shadow:0 0 0 8px var(--au);overflow:hidden}
.paper::before{content:"تكاتف";position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-size:130px;font-weight:800;color:var(--o);opacity:.045;pointer-events:none;white-space:nowrap}
.ph{text-align:center;border-bottom:3px double var(--o);padding-bottom:12px}
.ph .brand{font-size:34px}
.pt{text-align:center;font-size:24px;font-weight:800;margin:24px 0;color:var(--o2);position:relative}
.pt::after{content:"";display:block;width:70px;height:3px;background:var(--au);margin:8px auto 0}
.pm{display:flex;justify-content:space-between;font-size:13px;color:#666}
.pb{line-height:2.2;font-size:18px;margin:24px 0 170px;white-space:pre-wrap;position:relative}
.pf{position:absolute;bottom:28px;right:30px;left:30px;display:flex;justify-content:space-between;align-items:flex-end}
.stamp{width:96px;height:96px;border:3px double var(--o);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--o);font-weight:800;font-size:18px;transform:rotate(-12deg);opacity:.8}
.pbtn{max-width:640px;margin:0 auto 12px;display:flex;gap:8px}
@media print{body>*:not(#paperWrap){display:none!important}#paperWrap{position:static;background:#fff;padding:0}.pbtn{display:none}.paper{box-shadow:none;outline:0}}

.login{position:relative;overflow:hidden;background:linear-gradient(135deg,#031d10,#0f4d2e,#1c7a48,#0f4d2e,#031d10);background-size:300% 300%;animation:bg 14s ease infinite}
.login::before,.login::after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle,#c8a24a55,transparent 70%);animation:fl 7s ease-in-out infinite}
.login::before{width:300px;height:300px;top:-90px;left:-90px}
.login::after{width:360px;height:360px;bottom:-130px;right:-110px;animation-delay:-3s}
.box{position:relative;z-index:1;animation:up .8s both}
.box .brand{background:linear-gradient(90deg,#0f4d2e,#c8a24a,#0f4d2e);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
.box .sub,.box input,.box .btn{animation:up .8s both}
.box input:nth-of-type(1){animation-delay:.2s}.box input:nth-of-type(2){animation-delay:.3s}.box .btn{animation-delay:.4s}
img.emb{display:block;width:108px;height:108px;margin:-86px auto 10px;border-radius:50%;object-fit:cover;border:4px solid var(--au);background:#07301c;animation:fl 4s ease-in-out infinite,glow 3s ease-in-out infinite}
img.lg{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--au);animation:glow 3.5s ease-in-out infinite}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,transparent,#fff8,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:sw 3s linear infinite}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#ffffff55,transparent);transform:skewX(-20deg);animation:btnsh 4s ease-in-out infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px}
.stat{background:linear-gradient(145deg,#1c7a48,#07301c);color:#fff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--sh);border-bottom:3px solid var(--au)}
.stat b{display:block;font-size:28px;font-weight:800;color:#f3d98a}
.stat span{font-size:13px;opacity:.9}
.pop .card,.pop .stat{animation:up .5s both}
.pop .card:nth-child(2),.pop .stat:nth-child(2){animation-delay:.08s}
.pop .card:nth-child(3),.pop .stat:nth-child(3){animation-delay:.16s}
.pop .card:nth-child(n+4){animation-delay:.24s}
.item,.tag,.x{transition:.2s}
.x:active,.tag:active{transform:scale(.9)}
tr:hover td{filter:brightness(.97)}
#paperWrap{animation:fade .3s both}
.paper{animation:up .5s both}
.paper::before{content:"";top:0;left:0;right:0;bottom:0;transform:none;font-size:0;background:var(--logo) center 45%/360px no-repeat;opacity:.07;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.plogo{display:block;width:88px;height:88px;margin:0 auto 6px;border-radius:50%;object-fit:cover;border:3px solid var(--au)}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #c8a24a66,0 8px 20px rgba(0,0,0,.3)}50%{box-shadow:0 0 0 12px #c8a24a00,0 8px 26px rgba(200,162,74,.45)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes sw{from{background-position:-50% 0}to{background-position:150% 0}}
@keyframes btnsh{0%,60%{left:-60%}100%{left:130%}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.mb{background:#ffffff1f;border:1px solid #ffffff44;color:#fff;border-radius:10px;width:42px;height:42px;font-size:22px;font-family:inherit}
.ttl{font-size:14px;color:#f3d98a;font-weight:700}
.ov{position:fixed;inset:0;background:#000a;z-index:20;animation:fade .25s both}
#side{position:fixed;top:0;bottom:0;right:0;width:285px;max-width:84vw;background:linear-gradient(170deg,#031d10,#0f4d2e);z-index:21;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-left:3px solid var(--au);box-shadow:-10px 0 30px #0007}
#side.open{transform:none}
.sh{padding:26px 18px 16px;text-align:center;color:#fff;border-bottom:1px solid #ffffff22}
.sh .plg{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--au);animation:glow 3.5s infinite;display:block;margin:0 auto 8px}
.sh b{display:block;font-size:24px;font-weight:800}
.sh small{color:#f3d98a;font-size:12px}
#menu{flex:1;padding:12px;overflow:auto}
.mi{display:block;width:100%;text-align:right;background:none;border:0;color:#e6f2e8;font-size:17px;font-weight:600;font-family:inherit;padding:13px 14px;border-radius:12px;margin-bottom:4px;transition:.2s;border-right:4px solid transparent}
.mi:active{background:#ffffff14}
.mi.on{background:#ffffff1c;border-right-color:var(--au);color:#fff}
.so{margin:12px;background:#a4552e;color:#fff;border:0;border-radius:12px;padding:13px;font-family:inherit;font-weight:700;font-size:16px}
.welcome{margin:12px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#1c7a48,#07301c);color:#fff;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sh);border-bottom:4px solid var(--au)}
.wh{font-size:21px;font-weight:800}.mu2{font-size:13px;color:#f3d98a}
.wl{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--au);animation:fl 4s ease-in-out infinite}
.cnt{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px}
.cc{background:#fff;border-radius:18px;padding:16px 10px;text-align:center;box-shadow:var(--sh);border:1px solid #dbe8d6;animation:up .5s both}
.cc:nth-child(2){animation-delay:.06s}.cc:nth-child(3){animation-delay:.12s}.cc:nth-child(4){animation-delay:.18s}.cc:nth-child(5){animation-delay:.24s}.cc:nth-child(6){animation-delay:.3s}
.ci{font-size:26px;display:block}
.cc b{display:block;font-size:34px;font-weight:800;color:var(--o);line-height:1.2}
.cc small{color:#6a7a66;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;margin:8px 2px;font-weight:600}
.chk input{width:20px;height:20px;margin:0}
.bd{background:#f7e9b8;color:#6b5200;border-radius:20px;padding:2px 10px;font-size:12px;font-style:normal;font-weight:700;flex:0 0 auto}
.item .av{flex:0 0 42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#1c7a48,#07301c);color:#f3d98a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.pw{position:relative}.pw input{padding-left:46px}
#eye{position:absolute;left:8px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:20px;opacity:.7}
.sec2{margin-top:14px;font-size:12px;color:#6a7a66}
#main{padding-bottom:30px}

body{background:linear-gradient(180deg,#0b3b26,#06251a) fixed;color:#eaf5ee}
.login{background:radial-gradient(circle at 20% 12%,#1e6b43 0,transparent 45%),linear-gradient(180deg,#0b3b26,#06251a);background-size:auto;animation:none}
.login::before{width:auto;height:auto;top:0;left:0;right:0;bottom:0;border-radius:0;animation:none;background:repeating-linear-gradient(45deg,#ffffff0a 0 2px,transparent 2px 28px),repeating-linear-gradient(-45deg,#ffffff07 0 2px,transparent 2px 28px)}
.login::after{opacity:.5}
.box{background:none;box-shadow:none;border:0;max-width:380px;padding:20px 22px}
img.emb{width:150px;height:150px;border-radius:32px;border:0;margin:0 auto 8px;box-shadow:0 14px 40px #000a;animation:fl 4s ease-in-out infinite}
.box .brand{background:none;-webkit-text-fill-color:#fff;color:#fff;animation:none;font-size:42px}
.brand2{color:#fff;letter-spacing:5px;font-weight:700;margin:-4px 0 20px}
.fld{position:relative}
.fld span{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.8}
.fld input{padding-right:46px;padding-left:46px;text-align:center}
.box input{background:#ffffff12;border:1px solid #ffffff22;color:#fff;animation:none}
::placeholder{color:#9fb8a8}
.box .btn{background:linear-gradient(135deg,#a4f04a,#7ddc2f);color:#06251a;font-size:18px;font-weight:800;animation:none}
.fg{display:block;text-align:right;color:#8df03f;font-size:14px;margin:6px 2px;cursor:pointer}
.err{color:#ff8d73}.sec2{color:#9fb8a8}
.bar{background:#0b3b26cc;backdrop-filter:blur(8px);border:0;box-shadow:none}
.bar small{color:#8df03f}.ttl{color:#9fb8a8}
.card{background:#ffffff0f;border:1px solid #ffffff14;box-shadow:none;color:#eaf5ee}

#main input,#main select,#main textarea{background:#ffffff12;border:1px solid #ffffff22;color:#fff}
#main input:focus,#main select:focus,#main textarea:focus{border-color:#8df03f;box-shadow:0 0 0 3px #8df03f33}
option{color:#000}
#main .btn{background:linear-gradient(135deg,#a4f04a,#7ddc2f);color:#06251a}
#main .btn.gold{background:#ffffff14;color:#8df03f;border:1px solid #8df03f66}
.btn::after{display:none}
.tag{background:#8df03f22;color:#8df03f;border:1px solid #8df03f55}
.x{background:#ff6b4a22;color:#ff8d73}
.bd{background:#8df03f22;color:#8df03f}
.item .av{background:#8df03f22;color:#8df03f;border:1px solid #8df03f55}
.cc{background:#ffffff0f;border:1px solid #ffffff14;color:#fff}.cc b{color:#8df03f}.cc small{color:#9fb8a8}
.stat{background:#ffffff0f;border:1px solid #ffffff14;border-bottom:3px solid #8df03f}.stat b{color:#8df03f}
th{background:transparent;color:#9fb8a8;font-weight:600;border-bottom:1px solid #ffffff14}
td{border-bottom:1px solid #ffffff10;color:#eaf5ee}
tr:nth-child(even) td{background:transparent}
tr.r1 td{background:linear-gradient(90deg,#2f8f3a,#1d6b33)!important;color:#fff}
tr.r2 td,tr.r3 td{background:transparent!important}
td:last-child{color:#8df03f}
.tb{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#8df03f22;border:1px solid #8df03f66;color:#8df03f;font-size:12px;align-items:center;justify-content:center;margin-left:6px;vertical-align:middle}
.sec{display:flex;align-items:center;gap:14px;margin:10px 12px;padding:16px;border-radius:18px;background:#ffffff0f;border:1px solid #ffffff14;animation:up .5s both}
.sic{width:46px;height:46px;border-radius:14px;background:#8df03f1a;border:1px solid #8df03f55;display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
.stx{flex:1}.stx b{display:block;font-size:17px;color:#fff}.stx small{color:#9fb8a8}
.chev{color:#8df03f;font-size:28px}
#main{padding-bottom:100px}

.bn{flex:1;background:none;border:0;color:#9fb8a8;padding:9px 0 8px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.bn span{font-size:21px}.bn small{font-size:11px}
.bn.on{color:#8df03f}.bn.on::before{content:"";position:absolute;top:0;width:34px;height:3px;background:#8df03f;border-radius:0 0 4px 4px}

.paper{color:#232817}.paper .mu{color:#666}

.seg{display:flex;background:#ffffff12;border-radius:14px;padding:4px;margin:6px 0 14px}

.seg button.on{background:#8df03f;color:#06251a}
.box .btn.ghost{background:#ffffff14;color:#fff;border:1px solid #ffffff33}

[dir=ltr] #side{right:auto;left:0;transform:translateX(-105%);border-left:0;border-right:3px solid var(--au)}

<body>

<div id="loginView" class="login hide"><div class="box">
  <img class="emb" data-logo alt="">
  <div class="brand">تكاتف</div><div class="brand2">TAKATUF</div>
  <div class="seg"><button id="mLogin" class="on" type="button">تسجيل الدخول</button><button id="mReg" type="button">حساب جديد</button></div>
  <div class="fld"><span>✉️</span><input id="em" class="ltr" type="email" placeholder="البريد الإلكتروني" autocomplete="username"></div>
  <div class="fld"><span>🔒</span><input id="pw" class="ltr" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="eye" type="button">👁</button></div>
  <div class="fld hide" id="pw2w"><span>🔒</span><input id="pw2" class="ltr" type="password" placeholder="تأكيد كلمة المرور" autocomplete="new-password"></div>
  <a id="fg" class="fg">نسيت كلمة المرور؟</a>
  <div id="err" class="err"></div>
  <button class="btn" id="goBtn">تسجيل الدخول</button>
  <div class="sec2">🔒 اتصال مشفّر · خمس محاولات ثم إيقاف مؤقت</div>
</div></div>

<div id="verifyView" class="login hide"><div class="box">
  <img class="emb" data-logo alt="">
  <div class="brand" style="font-size:30px">تأكيد البريد</div>
  <p id="vtxt" class="vt"></p>

  catch (x) { const f = lsGet("tk_f") + 1; lsSet("tk_f", f); if (f >= 5) { lsSet("tk_lock", Date.now() + 60000); lsSet("tk_f", 0); err.textContent = "محاولات كثيرة، تم الإيقاف لمدة دقيقة"; } else err.textContent = "الإيميل أو كلمة السر غلط (باقي " + (5 - f) + ")"; }
};
$("vDone").onclick = async () => { const u = auth.currentUser; if (!u) return; try { await u.reload(); } catch (x) {} if (u.emailVerified) { await u.getIdToken(true); location.reload(); } else { $("verr").style.color = ""; $("verr").textContent = "لم يتم التأكيد بعد. افتح الرابط بالرسالة (تفقّد الرسائل غير المرغوبة)"; } };
let lastSend = 0;
$("vRe").onclick = async () => { const u = auth.currentUser, v = $("verr"); v.style.color = ""; if (!u || Date.now() - lastSend < 60000) { v.textContent = "انتظر دقيقة قبل إعادة الإرسال"; return; } lastSend = Date.now(); try { await sendEmailVerification(u); v.style.color = "#8df03f"; v.textContent = "تم إرسال الرسالة من جديد"; } catch (x) { v.textContent = "تعذر الإرسال، حاول لاحقاً"; } };
$("vOut").onclick = () => signOut(auth);
$("pw").onkeydown = e => { if (e.key == "Enter") $("goBtn").click(); };
$("outBtn").onclick = () => signOut(auth);

let docsOn = false;
const showV = id => ["loginView", "verifyView", "appView"].forEach(x => $(x).classList.toggle("hide", x != id));
function refreshDocsSub() { if (!isAdmin() && S.me.canIssue && !docsOn) { docsOn = true; live("docs"); } }
onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = []; docsOn = false;
  $("paperWrap").classList.add("hide"); closeMenu();
  if (!u) { me = ""; Object.keys(S).forEach(k => { S[k] = Array.isArray(S[k]) ? [] : {}; }); showV("loginView"); return; }
  me = u.email;
  if (!u.emailVerified && !isAdmin()) { $("vtxt").textContent = "أرسلنا رسالة تأكيد إلى " + u.email + ". افتح الرابط الموجود فيها ثم اضغط الزر تحت. (تفقّد الرسائل غير المرغوبة)"; showV("verifyView"); return; }
  showV("appView");
  unsubs.push(onSnapshot(doc(db, "staff", u.email.toLowerCase()), d => { S.me = d.exists() ? d.data() : {}; refreshDocsSub(); draw(); }, () => {}));
  unsubs.push(onSnapshot(doc(db, "users", u.uid), d => { S.prof = d.exists() ? d.data() : {}; draw(); }, () => {}));
  ["teams", "matches", "news", "scorers"].forEach(live);
  if (isAdmin()) ["tasks", "staff", "logs", "docs"].forEach(live);
  if (!sessionStorage.getItem("lg")) { sessionStorage.setItem("lg", "1"); setTimeout(() => log("سجّل الدخول"), 1500); }
  tab = "dash"; $("main").classList.add("pop"); draw(); bump();
});
applyPrefs();
</script>
</body>
