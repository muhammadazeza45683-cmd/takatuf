<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تكاتف</title>
<style>
:root{--o:#4b5320;--o2:#2f3a16;--cr:#f3efe0;--au:#c8a24a;--tc:#a4552e;--tx:#232817}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--cr);color:var(--tx)}
.hide{display:none!important}
.login{min-height:100vh;background:linear-gradient(160deg,var(--o2),var(--o));display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--cr);width:100%;max-width:380px;padding:30px 22px;border-radius:20px;text-align:center;border-top:6px solid var(--au)}
.brand{font-size:34px;font-weight:bold;color:var(--o);letter-spacing:1px}
.sub{color:#6b6f55;font-size:13px;margin:2px 0 14px}
input,select,textarea{width:100%;font-size:16px;padding:11px;margin:4px 0;border:1px solid #cfc9ae;border-radius:10px;background:#fff;font-family:inherit}
.ltr{direction:ltr;text-align:left}
.btn{width:100%;background:var(--o);color:#fff;font-size:16px;padding:12px;border:0;border-radius:10px;margin-top:8px;font-family:inherit}
.btn.gold{background:var(--au);color:var(--o2);font-weight:bold}
.err{color:#b03a2e;min-height:18px;font-size:14px}
.bar{background:var(--o2);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--au)}
.bar b{flex:1;font-size:21px}
.bar small{display:block;font-weight:normal;font-size:11px;color:#d9d4b4}
.bar button{background:#ffffff22;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-family:inherit}
.tabs{display:flex;gap:6px;padding:10px;overflow-x:auto}
.tabs button{flex:1;min-width:76px;padding:10px 6px;border:0;border-radius:10px;background:#e4dfc6;color:var(--o2);font-size:15px;font-family:inherit}
.tabs button.on{background:var(--o);color:#fff}
.card{background:#fff;margin:10px;padding:14px;border-radius:12px;box-shadow:0 1px 3px #0002}
.card h3{margin:0 0 8px;color:var(--o)}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}
.item:last-child{border:0}
.item span{flex:1;word-break:break-word}
.item.done span{text-decoration:line-through;color:#999}
.x{background:none;border:0;color:var(--tc);font-size:18px;flex:0 0 auto}
.mu{color:#80836a;font-size:13px}
.tag{background:var(--o);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-family:inherit;flex:0 0 auto}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:center}
th{background:var(--o);color:#fff;padding:7px 3px}
td{padding:7px 3px;border-bottom:1px solid #eee}
td.nm{text-align:right;font-weight:bold}
tr:nth-child(2) td{background:#f6efd2}
#paperWrap{position:fixed;inset:0;background:#000a;overflow:auto;padding:12px;z-index:9}
.paper{background:#fff;max-width:620px;margin:0 auto;padding:28px 26px;border:1px solid #bbb;min-height:560px;position:relative}
.ph{text-align:center;border-bottom:3px double var(--o);padding-bottom:10px}
.ph .brand{font-size:30px}
.pt{text-align:center;font-size:22px;font-weight:bold;margin:22px 0;color:var(--o2)}
.pm{display:flex;justify-content:space-between;font-size:13px;color:#555}
.pb{line-height:2.1;font-size:17px;margin:22px 0 150px;white-space:pre-wrap}
.pf{position:absolute;bottom:24px;right:26px;left:26px;display:flex;justify-content:space-between;align-items:flex-end}
.stamp{width:90px;height:90px;border:3px solid var(--o);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--o);font-weight:bold;transform:rotate(-12deg);opacity:.75}
.pbtn{max-width:620px;margin:0 auto 10px;display:flex;gap:8px}
@media print{body>*:not(#paperWrap){display:none!important}#paperWrap{position:static;background:#fff;padding:0}.pbtn{display:none}.paper{border:0}}
</style>
</head>
<body>

<div id="loginView" class="login hide"><div class="box">
  <div style="font-size:46px">🤝</div>
  <div class="brand">تكاتف</div><div class="sub">بوابة الإدارة</div>
  <input id="em" class="ltr" type="email" placeholder="الإيميل" autocomplete="username">
  <input id="pw" class="ltr" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <div id="err" class="err"></div>
  <button class="btn" id="goBtn">دخول</button>
</div></div>

<div id="appView" class="hide">
  <div class="bar"><span style="font-size:28px">🤝</span><b>تكاتف<small id="who"></small></b><button id="outBtn">خروج</button></div>
  <div class="tabs" id="tabs"></div>
  <div id="main"></div>
</div>
<div id="paperWrap" class="hide"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, setDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ADMIN = "muhammadazeza45683@gmail.com"; // إيميل المدير (نفس الموجود بقواعد Firestore)

const app = initializeApp({
  apiKey: "AIzaSyAOHZv8F1iaiwKBsEcZip3d_JsCPyoelJw",
  authDomain: "takatuf-db2b0.firebaseapp.com",
  projectId: "takatuf-db2b0",
  storageBucket: "takatuf-db2b0.firebasestorage.app",
  messagingSenderId: "743125913645",
  appId: "1:743125913645:web:57117ec8b671f99ac6e8a4"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const h = (t, a = {}, ...k) => { const e = document.createElement(t); for (const [x, y] of Object.entries(a)) { if (x == "on") for (const [v, f] of Object.entries(y)) e.addEventListener(v, f); else if (x == "cls") e.className = y; else e[x] = y; } e.append(...k); return e; };
const ok = fn => async (...a) => { try { await fn(...a); } catch (e) { alert("ما عندك صلاحية لهالعملية أو صار خطأ بالحفظ."); } };
const add = (c, d) => addDoc(collection(db, c), { ...d, t: serverTimestamp() });
const del = (c, id) => deleteDoc(doc(db, c, id));
const dt = v => v.t ? v.t.toDate().toLocaleDateString("ar") : "";

let unsubs = [], me = "", S = { tasks: [], news: [], teams: [], matches: [], docs: [], staff: [] }, tab = "league";
const isAdmin = () => me.toLowerCase() == ADMIN.toLowerCase();
const canIssue = () => isAdmin() || S.staff.some(s => s.id == me.toLowerCase() && s.canIssue);
const staffName = () => (S.staff.find(s => s.id == me.toLowerCase()) || {}).name || me;

const TABS = [["league", "الدوري"], ["docs", "الوثائق"], ["news", "الأخبار"], ["tasks", "المهام"]];
function draw() {
  $("tabs").replaceChildren(...TABS.map(([k, n]) => h("button", { cls: tab == k ? "on" : "", textContent: n, on: { click: () => { tab = k; draw(); } } })));
  $("main").replaceChildren(({ league, docs, news, tasks })[tab]());
}

function league() {
  const T = {}; S.teams.forEach(t => T[t.id] = { n: t.name, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 });
  S.matches.forEach(m => { const a = T[m.home], b = T[m.away]; if (!a || !b) return; a.p++; b.p++; a.gf += m.hg; a.ga += m.ag; b.gf += m.ag; b.ga += m.hg;
    if (m.hg > m.ag) { a.w++; b.l++; a.pts += 3; } else if (m.hg < m.ag) { b.w++; a.l++; b.pts += 3; } else { a.d++; b.d++; a.pts++; b.pts++; } });
  const rows = Object.values(T).sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf);
  const tb = h("table", {}, h("tr", {}, ...["الفريق", "لعب", "ف", "ت", "خ", "له", "عليه", "فرق", "نقاط"].map(x => h("th", { textContent: x }))),
    ...rows.map(r => h("tr", {}, h("td", { cls: "nm", textContent: r.n }), ...[r.p, r.w, r.d, r.l, r.gf, r.ga, r.gf - r.ga, r.pts].map(x => h("td", { textContent: x })))));
  const out = h("div", {}, h("div", { cls: "card" }, h("h3", { textContent: "ترتيب الدوري" }), S.teams.length ? h("div", { style: "overflow-x:auto" }, tb) : h("div", { cls: "mu", textContent: "أضف فرق لتبدأ" })));
  if (isAdmin()) {
    const tn = h("input", { placeholder: "اسم الفريق" });
    const mk = () => h("select", {}, ...S.teams.map(t => h("option", { value: t.id, textContent: t.name })));
    const hs = mk(), as = mk(), hg = h("input", { type: "number", min: 0, placeholder: "أهداف" }), ag = h("input", { type: "number", min: 0, placeholder: "أهداف" });
    out.append(
      h("div", { cls: "card" }, h("h3", { textContent: "إضافة فريق" }), tn, h("button", { cls: "btn", textContent: "إضافة", on: { click: ok(async () => { if (tn.value.trim()) { await add("teams", { name: tn.value.trim() }); } }) } })),
      h("div", { cls: "card" }, h("h3", { textContent: "تسجيل نتيجة مباراة" }), h("div", { cls: "row" }, hs, as), h("div", { cls: "row" }, hg, ag),
        h("button", { cls: "btn gold", textContent: "حفظ النتيجة", on: { click: ok(async () => { if (hs.value == as.value || hg.value === "" || ag.value === "") return alert("اختر فريقين مختلفين واكتب النتيجة"); await add("matches", { home: hs.value, away: as.value, hg: +hg.value, ag: +ag.value }); }) } })));
  }
  const nm = id => (T[id] || {}).n || "?";
  out.append(h("div", { cls: "card" }, h("h3", { textContent: "المباريات" }), S.matches.length ? h("div", {}, ...S.matches.map(m => h("div", { cls: "item" }, h("span", { textContent: `${nm(m.home)} ${m.hg} - ${m.ag} ${nm(m.away)}` }), isAdmin() ? h("button", { cls: "x", textContent: "🗑", on: { click: ok(() => del("matches", m.id)) } }) : ""))) : h("div", { cls: "mu", textContent: "لا يوجد مباريات" })));
  if (isAdmin() && S.teams.length) out.append(h("div", { cls: "card" }, h("h3", { textContent: "الفرق" }), ...S.teams.map(t => h("div", { cls: "item" }, h("span", { textContent: t.name }), h("button", { cls: "x", textContent: "🗑", on: { click: ok(() => del("teams", t.id)) } })))));
  return out;
}

const TYPES = ["شهادة عمل", "إفادة", "تعريف بالراتب", "خطاب رسمي"];
function docs() {
  const out = h("div");
  if (canIssue()) {
    const ty = h("select", {}, ...TYPES.map(x => h("option", { textContent: x }))), to = h("input", { placeholder: "اسم المستفيد" }), nt = h("textarea", { rows: 3, placeholder: "نص الوثيقة (اختياري)" });
    out.append(h("div", { cls: "card" }, h("h3", { textContent: "إخراج وثيقة" }), ty, to, nt, h("button", { cls: "btn gold", textContent: "إصدار الوثيقة", on: { click: ok(async () => { if (!to.value.trim()) return; await add("docs", { type: ty.value, to: to.value.trim(), body: nt.value.trim(), by: staffName() }); to.value = ""; nt.value = ""; }) } })));
  } else out.append(h("div", { cls: "card mu", textContent: "ليس لديك صلاحية إصدار الوثائق." }));
  out.append(h("div", { cls: "card" }, h("h3", { textContent: "الوثائق الصادرة" }), S.docs.length ? h("div", {}, ...S.docs.map(d => h("div", { cls: "item" }, h("span", {}, h("b", { textContent: d.type }), h("div", { cls: "mu", textContent: `${d.to} · ${dt(d)} · ${d.by}` })), h("button", { cls: "tag", textContent: "عرض", on: { click: () => paper(d) } }), isAdmin() ? h("button", { cls: "x", textContent: "🗑", on: { click: ok(() => del("docs", d.id)) } }) : ""))) : h("div", { cls: "mu", textContent: "لا يوجد وثائق" })));
  if (isAdmin()) {
    const se = h("input", { cls: "ltr", placeholder: "إيميل الموظف", type: "email" }), sn = h("input", { placeholder: "اسم الموظف" });
    out.append(h("div", { cls: "card" }, h("h3", { textContent: "صلاحية إصدار الوثائق" }), h("div", { cls: "mu", textContent: "الموظف لازم يكون له حساب بـ Firebase Authentication أول." }), se, sn,
      h("button", { cls: "btn", textContent: "منح الصلاحية", on: { click: ok(async () => { const e = se.value.trim().toLowerCase(); if (!e) return; await setDoc(doc(db, "staff", e), { name: sn.value.trim() || e, canIssue: true, t: serverTimestamp() }); se.value = ""; sn.value = ""; }) } }),
      ...S.staff.map(s => h("div", { cls: "item" }, h("span", { textContent: `${s.name} (${s.id})` }), h("button", { cls: "x", textContent: "🗑", on: { click: ok(() => del("staff", s.id)) } })))));
  }
  return out;
}

function paper(d) {
  const body = d.body || `تشهد إدارة تكاتف بأن السيد/ة ${d.to} تربطه/ها بها علاقة موثقة لدينا، وقد أُعطيت له/ها هذه الوثيقة بناءً على طلبه/ها دون أدنى مسؤولية على الإدارة.`;
  const w = $("paperWrap");
  w.replaceChildren(h("div", { cls: "pbtn" }, h("button", { cls: "btn gold", textContent: "طباعة / حفظ PDF", on: { click: () => window.print() } }), h("button", { cls: "btn", textContent: "إغلاق", on: { click: () => w.classList.add("hide") } })),
    h("div", { cls: "paper" },
      h("div", { cls: "ph" }, h("div", { cls: "brand", textContent: "🤝 تكاتف" }), h("div", { cls: "mu", textContent: "وثيقة رسمية" })),
      h("div", { cls: "pm" }, h("span", { textContent: "الرقم: " + d.id.slice(0, 6).toUpperCase() }), h("span", { textContent: "التاريخ: " + (dt(d) || new Date().toLocaleDateString("ar")) })),
      h("div", { cls: "pt", textContent: d.type }),
      h("div", { cls: "pb", textContent: body }),
      h("div", { cls: "pf" }, h("div", {}, h("div", { cls: "mu", textContent: "أصدرها" }), h("b", { textContent: d.by }), h("div", { textContent: "________________" })), h("div", { cls: "stamp", textContent: "تكاتف" }))));
  w.classList.remove("hide");
}

function news() {
  const out = h("div");
  if (isAdmin()) { const t = h("input", { placeholder: "عنوان الخبر" }), b = h("textarea", { rows: 3, placeholder: "نص الخبر" });
    out.append(h("div", { cls: "card" }, h("h3", { textContent: "نشر خبر" }), t, b, h("button", { cls: "btn", textContent: "نشر", on: { click: ok(async () => { if (t.value.trim()) { await add("news", { title: t.value.trim(), body: b.value.trim() }); t.value = ""; b.value = ""; } }) } }))); }
  out.append(...(S.news.length ? S.news.map(n => h("div", { cls: "card" }, h("b", { textContent: n.title }), h("div", { textContent: n.body || "" }), h("div", { cls: "mu", textContent: dt(n) }), isAdmin() ? h("button", { cls: "x", textContent: "🗑", on: { click: ok(() => del("news", n.id)) } }) : "")) : [h("div", { cls: "card mu", textContent: "لا يوجد أخبار" })]));
  return out;
}

function tasks() {
  const out = h("div");
  if (isAdmin()) { const i = h("input", { placeholder: "مهمة جديدة" });
    out.append(h("div", { cls: "card" }, i, h("button", { cls: "btn", textContent: "إضافة", on: { click: ok(async () => { if (i.value.trim()) { await add("tasks", { text: i.value.trim(), done: false }); i.value = ""; } }) } }))); }
  out.append(h("div", { cls: "card" }, ...(S.tasks.length ? S.tasks.map(t => h("div", { cls: "item" + (t.done ? " done" : "") }, h("span", { textContent: t.text, on: { click: isAdmin() ? ok(() => updateDoc(doc(db, "tasks", t.id), { done: !t.done })) : () => {} } }), isAdmin() ? h("button", { cls: "x", textContent: "🗑", on: { click: ok(() => del("tasks", t.id)) } }) : "")) : [h("div", { cls: "mu", textContent: "لا يوجد مهام" })])));
  return out;
}

const live = k => unsubs.push(onSnapshot(query(collection(db, k), orderBy("t", "desc")), s => { S[k] = s.docs.map(d => ({ id: d.id, ...d.data() })); draw(); }, () => {}));

$("goBtn").onclick = async () => { $("err").textContent = ""; try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); $("pw").value = ""; } catch (e) { $("err").textContent = "الإيميل أو كلمة السر غلط"; } };
$("pw").onkeydown = e => { if (e.key == "Enter") $("goBtn").click(); };
$("outBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = [];
  $("loginView").classList.toggle("hide", !!u); $("appView").classList.toggle("hide", !u); $("paperWrap").classList.add("hide");
  if (u) { me = u.email; ["teams", "matches", "docs", "news", "tasks", "staff"].forEach(live); $("who").textContent = isAdmin() ? "المدير" : "موظف"; draw(); }
});
</script>
</body>
</html>
